name: DCheck
version: '${version}'
main: dev.dcheckcloud.DCheckPlugin
api-version: '1.21'
author: DCheck
description: DCheck - cloud AI anticheat. Rotation analysis runs on the DCheck Cloud server.
folia-supported: false

commands:
  dcheck:
    description: DCheck administration command.
    usage: /dcheck <help|reload|status|debug|alerts|record|verify>
    permission: dcheck.admin
    aliases: [dc]

permissions:
  dcheck.admin:
    description: Full access to /dcheck.
    default: op
  dcheck.alerts:
    description: Receive DCheck alert broadcasts.
    default: op
  dcheck.bypass:
    description: Exempt player from AI-Aim analysis.
    default: false
